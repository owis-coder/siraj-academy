    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "__SITE_URL__/#organization",
            "name": "أكاديمية سراج التعليمية",
            "alternateName": "Siraj Educational Academy",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/brand/logo-mark-transparent.png",
            "description": "منصة سعودية لشرح المقررات الجامعية والدورات والخدمات الأكاديمية مع مدرسين معتمدين.",
            "areaServed": "SA",
            "knowsLanguage": ["ar", "en"]
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "name": "أكاديمية سراج التعليمية",
            "alternateName": "Siraj Educational Academy",
            "url": "__SITE_URL__/",
            "inLanguage": ["ar", "en"],
            "publisher": { "@id": "__SITE_URL__/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "__SITE_URL__/courses?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <script>
      (function () {
        try {
          var lang = localStorage.getItem('siraj_lang') === 'en' ? 'en' : 'ar';
          var fromUrl = new URLSearchParams(location.search).get('lang');
          if (fromUrl === 'en' || fromUrl === 'ar') lang = fromUrl;
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
        try {
          var t = localStorage.getItem('siraj_theme');
          // Default is light (white) as requested, dark only if explicitly chosen
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
